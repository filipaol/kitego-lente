name: Lente automatica KITEGO
on:
  schedule:
    - cron: "7,27,47 * * * *"   # ogni 20 minuti (UTC): al 07 tutte le pagine, al 27 e 47 solo le accese
  workflow_dispatch:         # e a mano, dal tasto "Run workflow"
concurrency:
  group: lente
  cancel-in-progress: false
jobs:
  leggi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installo il browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Leggo le pagine delle scuole
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node lente.mjs
