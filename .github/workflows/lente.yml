name: Lente automatica KITEGO
on:
  schedule:
    - cron: "7,27,47 * * * *"   # ogni 20 minuti (UTC): al 07 tutte le pagine, al 27 e 47 solo le accese
  workflow_dispatch:         # e a mano, dal tasto "Run workflow"
concurrency:
  group: lente
  cancel-in-progress: false
jobs:
  leggi:
    runs-on: ubuntu-24.04   # 6/10: fisso. Dal 19 ottobre "ubuntu-latest" diventa Ubuntu 26, e il browser (Playwright 1.49) li' potrebbe non installarsi
    timeout-minutes: 19     # 5/10: sta dentro i 20 minuti fra un giro e l'altro (la lettura si ferma da sola a 13)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # 6/10: Node 20 e' a fine vita
      - name: Installo il browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Leggo le pagine delle scuole
        timeout-minutes: 16
        continue-on-error: true   # se una pagina blocca tutto, il giro chiude lo stesso: le pagine lette sono gia' salvate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node lente.mjs
